[project]
name = "trainer"
version = "0.3.0"
description = "英語 4 技能（スピーキング・リスニング・ライティング・リーディング）の練習とスコア記録を行うローカルアプリ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
trainer = "trainer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
